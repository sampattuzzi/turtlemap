[tool.poetry]
name = "turtlemap"
version = "0.1.0"
description = "Browse a Python, JavaScript or TypeScript codebase as blueprint-style dependency maps and dataflow graphs"
authors = ["Turtlemap contributors"]
license = "AGPL-3.0-or-later"
readme = "README.md"
packages = [{ include = "turtlemap" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
tree-sitter = "^0.25"
tree-sitter-typescript = "^0.23"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
mypy = "^1.13"

[tool.poetry.scripts]
turtlemap = "turtlemap.app:main"
turtlemap-agent = "turtlemap.agent:main"
turtlemap-mcp = "turtlemap.mcp:main"

[tool.mypy]
strict = true
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
